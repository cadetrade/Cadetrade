# Costruisce l'immagine del bot (con i test) e la pubblica su ghcr.io, così il server la scarica già pronta.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/cadetrade/cadetrade:latest
          labels: org.opencontainers.image.source=https://github.com/cadetrade/Cadetrade
